<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> 股票交易紀錄APP </title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <style>
        :root { 
            --main-dark: #8c7a6b;   
            --main-blue: #dcb38b;   
            --up: #e26b6b;          
            --down: #8bc4a9;        
            --watch: #e6a87c;       
            --div: #e5b662;         
            --day: #b496c6;         
            --short: #84b2d1;       
            --long: #a89f91;        
            --bg-light: #fdfbf7;    
            --text-main: #5c4e46;   
            --text-sub: #9e8e82;    
        }
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background: var(--bg-light); margin: 0; padding-bottom: 120px; color: var(--text-main); }
        
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--main-dark); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pin-dots { display: flex; gap: 15px; margin-bottom: 30px; }
        .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #eaddcf; background: transparent; }
        .dot.filled { background: var(--main-blue); border-color: var(--main-blue); box-shadow: 0 0 10px rgba(220,179,139,0.5); }
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .numpad button { width: 75px; height: 75px; border-radius: 50%; background: rgba(255,255,255,0.1); color: white; font-size: 32px; font-weight: 700; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; }
        .numpad button:active { background: var(--main-blue); }

        .dashboard { background: var(--main-dark); color: white; padding: 15px; border-radius: 0 0 24px 24px; display: flex; flex-direction: column; gap: 10px; position: relative; transition: 0.3s; }
        .demo-badge { position: absolute; top: 15px; right: 15px; background: var(--div); color: white; font-size: 10px; font-weight: 900; padding: 3px 8px; border-radius: 12px; }
        .dash-section { background: rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; }
        .dash-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top:5px; }
        .stat-label { font-size: 11px; color: #eaddcf; font-weight: 700; margin-bottom: 2px; }
        .stat-value { font-size: 18px; font-weight: 900; }
        .up-text { color: var(--up); font-weight: 900; }
        .down-text { color: var(--down); font-weight: 900; }
        .pct-text { font-size: 13px; font-weight: 700; opacity: 0.9; margin-left: 2px; }
        
        .date-picker-small { background: rgba(255,255,255,0.15); border: 1px solid rgba(220,179,139,0.4); border-radius: 6px; padding: 4px 6px; font-weight: 700; color: white; outline: none; font-family: inherit; font-size: 11px; }
        .date-picker-small::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.8; cursor: pointer; }

        .header { background: white; padding: 15px 15px 5px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 15px rgba(140,122,107,0.08); border-bottom: 1px solid #f4efe9; }
        .search-area { display: flex; gap: 8px; margin-bottom: 10px; }
        .search-bar { background: #f4efe9; border-radius: 10px; padding: 10px; display: flex; align-items: center; flex: 1; }
        .search-bar input { border: none; background: transparent; outline: none; width: 100%; font-size: 15px; font-weight: bold; color: var(--text-main); }
        .search-bar input::placeholder { color: var(--text-sub); }
        
        .tab-group { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; -webkit-overflow-scrolling: touch; }
        .tab-group::-webkit-scrollbar { display: none; } 
        .tab-btn { padding: 8px 14px; border-radius: 20px; border: 1px solid #eaddcf; background: white; font-weight: 700; cursor: pointer; font-size: 13px; white-space: nowrap; color: var(--text-sub); }
        .tab-btn.active { background: var(--main-dark); color: white; border-color: var(--main-dark); }
        .tab-btn-action { padding: 8px 14px; border-radius: 20px; border: none; background: #f4efe9; color: var(--text-main); font-weight: 900; font-size: 13px; white-space: nowrap; cursor: pointer; }

        .card-grid { display: grid; gap: 12px; padding: 15px; grid-template-columns: repeat(2, 1fr); }
        .grid-item { background: white; border-radius: 16px; padding: 15px; box-shadow: 0 4px 10px rgba(140,122,107,0.05); border: 1px solid #f4efe9; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .grid-header { display: flex; align-items: baseline; gap: 6px; margin-bottom: 12px; border-bottom: 2px solid #f4efe9; padding-bottom: 8px; margin-top: 8px; }
        .grid-ticker { font-size: 26px; font-weight: 900; color: var(--text-main); letter-spacing: -0.5px; }
        .grid-name { font-size: 13px; font-weight: 700; color: var(--text-sub); }
        
        .grid-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-sub); margin-bottom: 6px; font-weight: 700; align-items: flex-start; }
        .grid-val { font-weight: 900; color: var(--text-main); font-size: 14px; }
        
        .badge-sold { position: absolute; top: 12px; right: 12px; background: #cbbcc2; color: white; font-size: 10px; padding: 3px 6px; border-radius: 4px; font-weight: bold; }
        .badge-watch { position: absolute; top: 12px; right: 12px; background: var(--watch); color: white; font-size: 10px; padding: 3px 6px; border-radius: 4px; font-weight: bold; }
        .badge-day { position: absolute; top: 12px; right: 12px; background: var(--day); color: white; font-size: 10px; padding: 3px 6px; border-radius: 4px; font-weight: bold; }
        .badge-short { position: absolute; top: 12px; right: 12px; background: var(--short); color: white; font-size: 10px; padding: 3px 6px; border-radius: 4px; font-weight: bold; }
        .badge-long { position: absolute; top: 12px; right: 12px; background: var(--long); color: white; font-size: 10px; padding: 3px 6px; border-radius: 4px; font-weight: bold; }

        .desktop-view .card-grid { grid-template-columns: repeat(4, 1fr); max-width: 1000px; margin: 0 auto; }
        .desktop-view .dashboard, .desktop-view .header { max-width: 1000px; margin: 0 auto; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(92,78,70,0.7); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-container { background: white; width: 92%; max-width: 500px; border-radius: 20px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; margin: 20px auto; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .modal-header { padding: 15px 20px; border-bottom: 1px solid #f4efe9; display: flex; justify-content: space-between; align-items: center; background: #fdfbf7; }
        .modal-content { padding: 20px; overflow-y: auto; flex: 1; }
        
        .tx-list { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .tx-item { background: #fdfbf7; border: 1px solid #f4efe9; border-radius: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .tx-type.buy { color: var(--up); background: rgba(226, 107, 107, 0.1); padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 900; }
        .tx-type.sell { color: var(--down); background: rgba(139, 196, 169, 0.1); padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 900; }
        .tx-type.watch { color: var(--watch); background: rgba(230, 168, 124, 0.1); padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 900; }
        .tx-type.div { color: var(--div); background: rgba(229, 182, 98, 0.1); padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 900; }

        .chart-wrapper { margin-top: 20px; border: 1px solid #f4efe9; padding: 15px; border-radius: 12px; background: white; }
        .chart-tabs { display: flex; background: #f4efe9; border-radius: 8px; overflow: hidden; padding: 2px; margin-bottom: 10px; gap: 2px; }
        .chart-tab { flex: 1; padding: 6px 2px; font-size: 11px; border: none; background: transparent; cursor: pointer; font-weight: 700; font-family: inherit; border-radius: 6px; color: var(--text-sub); }
        .chart-tab.active { background: white; color: var(--text-main); box-shadow: 0 1px 3px rgba(140,122,107,0.1); }

        .form-box { background: white; width: 92%; max-width: 500px; border-radius: 24px; padding: 25px; overflow-y: auto; max-height: 90vh; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text-sub); margin-bottom: 5px; }
        .input-control { width: 100%; padding: 12px; border: 1px solid #eaddcf; border-radius: 10px; font-size: 16px; box-sizing: border-box; font-weight: 700; font-family: inherit; color: var(--text-main); }
        
        .type-toggle { display: flex; background: #f4efe9; border-radius: 10px; padding: 4px; margin-bottom: 15px; gap: 4px; overflow-x: auto;}
        .type-btn { flex: 1; padding: 10px 5px; text-align: center; font-weight: 900; border-radius: 8px; cursor: pointer; color: var(--text-sub); transition: 0.2s; font-size: 13px; white-space: nowrap;}
        .type-btn.active.buy { background: var(--up); color: white; }
        .type-btn.active.sell { background: var(--down); color: white; }
        .type-btn.active.watch { background: var(--watch); color: white; }
        .type-btn.active.div { background: var(--div); color: white; }

        .fab { position: fixed; bottom: 30px; right: 30px; background: var(--main-blue); color: white; width: 60px; height: 60px; border-radius: 30px; font-size: 30px; display: flex; align-items: center; justify-content: center; font-weight: 900; box-shadow: 0 10px 15px -3px rgba(220,179,139,0.5); cursor: pointer; border: none; z-index: 100; transition: 0.2s; }
        .fab:active { transform: scale(0.9); }
    </style>
</head>
<body class="mobile-view">

<div id="loginScreen">
    <div style="font-size: 28px; font-weight: 900; margin-bottom: 10px; color: white;">Stock Pro</div>
    <div style="font-size: 12px; font-weight: bold; margin-bottom: 30px; color: #eaddcf;">(莫蘭迪特仕版 - 雲端連線)</div>
    <div class="pin-dots">
        <span class="dot" id="dot-0"></span><span class="dot" id="dot-1"></span>
        <span class="dot" id="dot-2"></span><span class="dot" id="dot-3"></span>
    </div>
    <div class="numpad">
        <button onclick="pressKey('1')">1</button><button onclick="pressKey('2')">2</button><button onclick="pressKey('3')">3</button>
        <button onclick="pressKey('4')">4</button><button onclick="pressKey('5')">5</button><button onclick="pressKey('6')">6</button>
        <button onclick="pressKey('7')">7</button><button onclick="pressKey('8')">8</button><button onclick="pressKey('9')">9</button>
        <div></div><button onclick="pressKey('0')">0</button><button onclick="pressKey('back')" style="border:none;">⌫</button>
    </div>
</div>

<div class="dashboard">
    <div class="demo-badge" id="cloudStatusBadge">雲端連線中...</div>
    <div style="font-size: 12px; color:#eaddcf; font-weight: 900; margin-bottom: 2px;">
        <span id="dash-title">☕ 總覽 (全部)</span>
    </div>
    
    <div class="dash-section">
        <div style="background: rgba(255,255,255,0.1); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
            <div style="font-size: 12px; color: #eaddcf; font-weight: 700;">💰 初始投入本金 <span style="font-size:10px; opacity:0.7;">(點擊設定)</span></div>
            <div class="stat-value" id="dash-initial-capital" style="cursor: pointer; color: white;" onclick="editInitialCapital()">$0</div>
        </div>

        <div class="dash-grid">
            <div><div class="stat-label">目前庫存投入成本</div><div class="stat-value" id="dash-cost">$0</div></div>
            <div><div class="stat-label">目前庫存總市值</div><div class="stat-value" id="dash-market">$0</div></div>
            <div><div class="stat-label">未實現損益</div><div class="stat-value" id="dash-unrealized">$0</div></div>
            <div><div class="stat-label">總實現淨利</div><div class="stat-value" id="dash-realized">$0</div></div>
        </div>
    </div>
    
    <div style="background: rgba(220,179,139,0.15); border-radius: 10px; padding: 12px; border: 1px solid rgba(220,179,139,0.3);">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <div style="font-size: 11px; font-weight: 700; color: #eaddcf;">📅 區間已實現淨利明細</div>
            <div style="display:flex; gap:6px; align-items:center;">
                <input type="date" id="startDate" class="date-picker-small" onchange="renderGrid()"> 
                <span style="color:#eaddcf; font-size:10px;">至</span>
                <input type="date" id="endDate" class="date-picker-small" onchange="renderGrid()">
            </div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:flex-end;">
            <button onclick="openProfitModal()" style="background:rgba(255,255,255,0.2); border:none; color:white; padding:4px 8px; border-radius:6px; font-size:11px; font-weight:bold; cursor:pointer;">📄 查看賣出對帳單</button>
            <div id="dash-period-pnl" style="font-size: 20px; font-weight: 900; color: white;">$0</div>
        </div>
    </div>
</div>

<div class="header">
    <div class="search-area">
        <div class="search-bar">🔍 <input type="text" id="searchInput" placeholder="搜尋代號或名稱..." oninput="renderGrid()"></div>
        </div>
    
    <input type="file" id="htmlUploader" accept=".html,.csv" style="display:none;" onchange="handleFileUpload(event)">
    
    <div class="tab-group" style="padding-bottom: 5px;">
        <button class="tab-btn-action" style="background:var(--main-blue); color:white;" onclick="openQuickPrice()">✏️ 更新目前分類時價</button>
        <button class="tab-btn-action" style="background:#b496c6; color:white;" onclick="document.getElementById('htmlUploader').click()">📤 匯入 Goodinfo / CSV</button>
        <button class="tab-btn-action" onclick="openAnalysis()">📊 資產分析</button>
        <button class="tab-btn-action" onclick="exportCSV()">📥 匯出報表</button>
    </div>
    
    <div class="tab-group">
        <button class="tab-btn active" id="filter-all" onclick="setFilter('all')">全部</button>
        <button class="tab-btn" id="filter-day_trade" onclick="setFilter('day_trade')">當沖(持)</button>
        <button class="tab-btn" id="filter-short_term" onclick="setFilter('short_term')">短期</button>
        <button class="tab-btn" id="filter-long_term" onclick="setFilter('long_term')">長期</button>
        <button class="tab-btn" id="filter-watch" onclick="setFilter('watch')">觀望</button>
        <button class="tab-btn" id="filter-sold_std" onclick="setFilter('sold_std')">一般結清</button>
        <button class="tab-btn" id="filter-sold_day" onclick="setFilter('sold_day')">當沖結清</button>
    </div>
</div>

<div id="portfolioGrid" class="card-grid"></div>
<button class="fab" onclick="openForm()">＋</button>

<div id="profitModal" class="modal" style="z-index: 250;">
    <div class="modal-container">
        <div class="modal-header">
            <div style="font-size:18px; font-weight:900; color:var(--text-main);">📄 已實現賣出對帳單</div>
            <button onclick="closeProfitModal()" style="border:none; background:none; font-size:24px; color:var(--text-sub); cursor:pointer;">×</button>
        </div>
        <div class="modal-content" style="background:#f4efe9;">
            <div style="font-size:12px; color:var(--text-sub); font-weight:bold; margin-bottom:15px; text-align:center;">
                此清單顯示您在所選日期區間內的「單筆賣出」與「配息」明細
            </div>
            <div id="profitListContainer" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>
    </div>
</div>

<div id="analysisModal" class="modal">
    <div class="modal-container">
        <div class="modal-header">
            <div style="font-size:18px; font-weight:900; color:var(--text-main);">📊 庫存資產配置</div>
            <button onclick="closeAnalysis()" style="border:none; background:none; font-size:24px; color:var(--text-sub); cursor:pointer;">×</button>
        </div>
        <div class="modal-content" style="display:flex; flex-direction:column; align-items:center;">
            <div style="font-size:12px; color:var(--text-sub); font-weight:bold; margin-bottom:15px;">依照目前市值的資金佔比 (不含觀望與結清)</div>
            <div style="position: relative; height:250px; width:100%;">
                <canvas id="assetPieChart"></canvas>
            </div>
            <div id="pieEmptyMsg" style="display:none; color:var(--text-sub); font-weight:bold; margin-top:20px;">目前沒有持倉股票喔！</div>
        </div>
    </div>
</div>

<div id="detailModal" class="modal">
    <div class="modal-container">
        <div class="modal-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="display: flex; align-items: baseline;">
                    <span id="detTicker" style="font-size:24px; font-weight:900; color:var(--text-main);">-</span>
                    <span id="detName" style="font-size:14px; font-weight:700; color:var(--text-sub); margin-left:8px;">-</span>
                </div>
                <button onclick="editStockName()" style="border:none; background:#f4efe9; border-radius:6px; padding:4px 8px; font-size:12px; font-weight:bold; color:var(--text-main); cursor:pointer;">✏️ 修改名稱</button>
            </div>
            <button onclick="closeDetail()" style="border:none; background:none; font-size:24px; color:var(--text-sub); cursor:pointer;">×</button>
        </div>
        <div class="modal-content">
            <div id="detStats" style="display:grid; grid-template-columns:1fr 1fr; gap:15px; background:var(--bg-light); padding:15px; border-radius:12px; border:1px solid #f4efe9; margin-bottom: 20px;"></div>

            <div class="chart-wrapper">
                <div style="font-size:13px; font-weight:900; color:var(--text-main); margin-bottom:10px;">📈 時價線圖 <span style="font-size:10px; color:var(--up); font-weight:normal;">(亮點為最新報價)</span></div>
                <div class="chart-tabs">
                    <button class="chart-tab" id="tab-day" onclick="updateChart('day')">當日</button>
                    <button class="chart-tab" id="tab-week" onclick="updateChart('week')">當周</button>
                    <button class="chart-tab active" id="tab-month" onclick="updateChart('month')">當月</button>
                    <button class="chart-tab" id="tab-quarter" onclick="updateChart('quarter')">當季</button>
                    <button class="chart-tab" id="tab-year" onclick="updateChart('year')">當年</button>
                </div>
                <div style="height: 180px; width: 100%;"><canvas id="priceChart"></canvas></div>
            </div>

            <div style="font-size:14px; font-weight:900; color:var(--text-main); margin:15px 0 10px; display:flex; justify-content:space-between; align-items:center;">
                <span>📝 歷史紀錄</span>
                <button onclick="openForm({ticker: document.getElementById('detTicker').innerText, name: document.getElementById('detName').innerText})" style="font-size:12px; padding:6px 10px; background:var(--main-blue); color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">+ 新增</button>
            </div>
            <div id="txList" class="tx-list"></div>
        </div>
    </div>
</div>

<div id="formModal" class="modal" style="z-index: 300;">
    <div class="form-box">
        <h3 id="formTitle" style="margin-top:0; font-size:20px; font-weight:900; color:var(--text-main);">新增紀錄</h3>
        
        <div class="type-toggle">
            <div class="type-btn active buy" id="typeBuy" onclick="setTxType('buy')">買進</div>
            <div class="type-btn sell" id="typeSell" onclick="setTxType('sell')">賣出</div>
            <div class="type-btn watch" id="typeWatch" onclick="setTxType('watch')">👀 觀望</div>
            <div class="type-btn div" id="typeDiv" onclick="setTxType('div')">💰 領息</div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 2fr; gap:10px;">
            <div class="input-group"><label>代號</label><input type="text" class="input-control" id="formTicker" placeholder="2330"></div>
            <div class="input-group"><label>名稱</label><input type="text" class="input-control" id="formName" placeholder="台積電"></div>
        </div>

        <div class="input-group" id="strategyGroup" style="background:#f4efe9; padding:10px; border-radius:10px;">
            <label>交易策略分類</label>
            <select class="input-control" id="formStrategy" style="background:white;">
                <option value="day_trade">⚡ 當沖</option>
                <option value="short_term">📈 短期持有</option>
                <option value="long_term" selected>☕ 長期持有</option>
            </select>
        </div>

        <div style="display:grid; grid-template-columns:2fr 1fr; gap:10px;" id="qtyGroup">
            <div class="input-group"><label>數量</label><input type="number" class="input-control" id="formQty" placeholder="1000"></div>
            <div class="input-group"><label>單位</label>
                <select class="input-control" id="formUnit">
                    <option value="share">股</option>
                    <option value="lot">張 (1000股)</option>
                </select>
            </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div class="input-group"><label id="priceLabel">成交單價</label><input type="number" step="0.01" class="input-control" id="formPrice"></div>
            <div class="input-group"><label>日期</label><input type="date" class="input-control" id="formDate"></div>
        </div>
        
        <div class="input-group" id="watchCurrentPriceGroup" style="display:none; background:rgba(229, 182, 98, 0.1); padding:10px; border-radius:10px;">
            <label style="color:#b28431;">目前市場時價 (供系統同步追蹤)</label>

            <label style="color:var(--up);">交易成本 (手續費/證交稅)</label>

        <button onclick="saveTransaction()" style="width:100%; padding:14px; background:var(--main-dark); color:white; border:none; border-radius:10px; font-size:16px; font-weight:900; cursor:pointer; margin-top:10px;">確認送出</button>
        <button onclick="closeForm()" style="width:100%; padding:12px; background:transparent; color:var(--text-sub); border:none; margin-top:5px; font-weight:700; cursor:pointer;">取消</button>
    </div>
</div>

<script>
    let currentPin = '';
    let isFirebaseConnected = false;
    let initialCapital = localStorage.getItem('stockpro_initialCapital') || 0;

    function pressKey(key) {
        if (key === 'back') currentPin = currentPin.slice(0, -1); 
        else if (currentPin.length < 4) currentPin += key; 
        
        for (let i = 0; i < 4; i++) {
            document.getElementById(`dot-${i}`).className = i < currentPin.length ? 'dot filled' : 'dot';
        }
        
        if (currentPin.length === 4) {
            setTimeout(() => {
                if (currentPin === '0305' || currentPin === '1234') { 
                    document.body.className = currentPin === '0305' ? 'mobile-view' : 'desktop-view'; 
                    document.getElementById('loginScreen').style.display = 'none'; 
                    checkFirebaseStatus(); 
                    document.getElementById('dash-initial-capital').innerText = '$' + parseFloat(initialCapital).toLocaleString();
                } else { 
                    Swal.fire({icon:"error", title:"密碼錯誤", confirmButtonColor:"#dcb38b"}); 
                    currentPin = ''; 
                    for(let i=0;i<4;i++) document.getElementById(`dot-${i}`).className='dot'; 
                }
            }, 100);
        }
    }

    function checkFirebaseStatus() {
        if (!isFirebaseConnected) {
            document.getElementById('cloudStatusBadge').innerText = "本機測試中";
            document.getElementById('cloudStatusBadge').style.background = "#9e8e82";
        } else {
            document.getElementById('cloudStatusBadge').innerText = "雲端同步中";
            document.getElementById('cloudStatusBadge').style.background = "var(--div)";
        }
    }

    async function editInitialCapital() {
        const { value: amount } = await Swal.fire({
            title: '設定初始投入本金',
            text: '請輸入您最初投入這個帳戶的總資金（不會隨買賣浮動）',
            input: 'number',
            inputValue: initialCapital,
            showCancelButton: true,
            confirmButtonColor: '#dcb38b',
            cancelButtonColor: '#cbbcc2'
        });

        if (amount !== undefined && amount !== null && amount !== '') {
            initialCapital = parseFloat(amount);
            document.getElementById('dash-initial-capital').innerText = '$' + initialCapital.toLocaleString();
            
            if (isFirebaseConnected) {
                db.ref('stockpro/settings/initialCapital').set(initialCapital);
            } else {
                localStorage.setItem('stockpro_initialCapital', initialCapital);
            }
            Swal.fire({icon: 'success', title: '設定成功', timer: 1000, showConfirmButton: false});
        }
    }

    // ====== 新增：手動修改股票代號與名稱的功能 ======
    async function editStockName() {
        const oldTicker = document.getElementById('detTicker').innerText;
        const oldName = document.getElementById('detName').innerText;

        const { value: formValues } = await Swal.fire({
            title: '修改股票名稱/代號',
            html:
                `<div style="text-align:left; margin-bottom:5px; font-weight:bold; font-size:14px;">代號：</div><input id="swal-input-ticker" class="swal2-input" placeholder="代號" value="${oldTicker}" style="margin-top:0;">` +
                `<div style="text-align:left; margin-bottom:5px; margin-top:15px; font-weight:bold; font-size:14px;">名稱：</div><input id="swal-input-name" class="swal2-input" placeholder="名稱" value="${oldName}" style="margin-top:0;">` +
                `<div style="font-size:12px; color:gray; margin-top:15px; text-align:left;">💡 提示：修改後，此股票所有的歷史紀錄都會一起被改名。<br>如果您想標示結清不再變動時價，建議可以在代號後方手動加上 <b>(清)</b>。</div>`,
            focusConfirm: false,
            showCancelButton: true,
            confirmButtonColor: '#dcb38b',
            cancelButtonColor: '#cbbcc2',
            preConfirm: () => {
                return {
                    newTicker: document.getElementById('swal-input-ticker').value.trim(),
                    newName: document.getElementById('swal-input-name').value.trim()
                }
            }
        });

        if (formValues && formValues.newTicker) {
            const { newTicker, newName } = formValues;
            if (newTicker === oldTicker && newName === oldName) return; 

            Swal.fire({ title: '更新中...', didOpen: () => Swal.showLoading() });

            let updates = {};
            
            allTransactions.forEach(t => {
                if (t.ticker === oldTicker) {
                    t.ticker = newTicker;
                    t.name = newName;
                    if (isFirebaseConnected) {
                        updates[`${t.id}/ticker`] = newTicker;
                        updates[`${t.id}/name`] = newName;
                    }
                }
            });

            if (marketPrices[oldTicker]) {
                marketPrices[newTicker] = JSON.parse(JSON.stringify(marketPrices[oldTicker]));
                delete marketPrices[oldTicker];
            }

            if (isFirebaseConnected) {
                if (Object.keys(updates).length > 0) {
                    await txRef.update(updates);
                }
                if (customPrices[oldTicker] !== undefined) {
                    await priceRef.child(newTicker).set(customPrices[oldTicker]);
                    await priceRef.child(oldTicker).remove();
                }
            }

            calculatePortfolio();
            closeDetail(); 
            Swal.fire({icon: "success", title: "修改成功！", timer: 1500, showConfirmButton: false});
        }
    }

    function getLocalDateStr(d) {
        const year = d.getFullYear(); const month = String(d.getMonth() + 1).padStart(2, '0'); const day = String(d.getDate()).padStart(2, '0'); return `${year}-${month}-${day}`;
    }
    function getFirstDayOfMonthStr(d) {
        const year = d.getFullYear(); const month = String(d.getMonth() + 1).padStart(2, '0'); return `${year}-${month}-01`;
    }
    
    const todayStr = getLocalDateStr(new Date());
    document.getElementById('startDate').value = getFirstDayOfMonthStr(new Date());
    document.getElementById('endDate').value = todayStr;

    // ====== 強化版 HTML/CSV 讀取解析器 ======
    async function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const fileName = file.name.toLowerCase();
        const isCsv = fileName.endsWith('.csv');
        
        Swal.fire({ title: '🔍 地毯式解析中...', text: '正在嘗試從檔案中提取報價資料', didOpen: () => Swal.showLoading() });

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const text = e.target.result;
                let newHistory = [];
                let ticker = "";

                if (isCsv) {
                    const lines = text.split(/\r?\n/);
                    const tickerMatch = fileName.match(/(\d{4,5})/);
                    ticker = tickerMatch ? tickerMatch[1] : "";

                    lines.forEach((line) => {
                        const cols = line.split(',');
                        if (cols.length >= 2) {
                            let dateText = cols[0].trim().replace(/\//g, '-'); 
                            let price = parseFloat(cols[1].trim());
                            if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(dateText) && !isNaN(price)) {
                                newHistory.push({ date: dateText, price: price });
                            }
                        }
                    });
                } else {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(text, 'text/html');
                    
                    const titleElem = doc.querySelector('title');
                    const captionElem = doc.querySelector('caption');
                    const fullTitle = (titleElem ? titleElem.innerText : "") + (captionElem ? captionElem.innerText : "");
                    const match = fullTitle.match(/(\d{4,5})/);
                    ticker = match ? match[1] : "";

                    // 更強大的地毯式搜索
                    const rows = doc.querySelectorAll('tr');
                    rows.forEach(row => {
                        const cells = Array.from(row.querySelectorAll('td, th'));
                        for (let i = 0; i < cells.length; i++) {
                            let cellText = cells[i].innerText.trim();
                            // 尋找任何長得像日期的格子：支援 YY/MM/DD, YYYY-MM-DD 等
                            let dateMatch = cellText.match(/^(?:')?(\d{2,4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
                            
                            // 如果找到了日期，且後面還有足夠的欄位 (通常收盤價在日期的往後數第4或第5格)
                            if (dateMatch && cells.length > i + 1) {
                                let year = dateMatch[1].length === 2 ? "20" + dateMatch[1] : dateMatch[1];
                                let formattedDate = `${year}-${dateMatch[2].padStart(2, '0')}-${dateMatch[3].padStart(2, '0')}`;
                                
                                // 嘗試抓取收盤價 (優先找往後第4格，如果沒有就找同行內的有效數字)
                                let priceText = '';
                                if (cells[i+4]) priceText = cells[i+4].innerText.trim().replace(/,/g, '');
                                else priceText = cells[cells.length-1].innerText.trim().replace(/,/g, '');
                                
                                let price = parseFloat(priceText);
                                if (!isNaN(price) && price > 0) {
                                    newHistory.push({ date: formattedDate, price: price });
                                    break; // 這一行找到一筆資料就跳出內圈，換下一行
                                }
                            }
                        }
                    });
                }

                if (!ticker) {
                    Swal.fire({
                        title: '辨識失敗',
                        text: '無法從檔案中辨識股票代號，請手動輸入',
                        input: 'text',
                        inputPlaceholder: '例如: 2330',
                        showCancelButton: true,
                        confirmButtonColor: '#dcb38b'
                    }).then((result) => {
                        if (result.value) processData(result.value, newHistory);
                    });
                } else {
                    processData(ticker, newHistory);
                }

            } catch(err) {
                console.error(err);
                Swal.fire({icon: 'error', title: '解析失敗', text: '檔案格式不正確或內容損毀', confirmButtonColor: '#dcb38b'});
            }
            event.target.value = ''; 
        };
        reader.readAsText(file);
    }

    function processData(ticker, newHistory) {
        if (newHistory.length === 0) {
            return Swal.fire({icon: 'error', title: '錯誤', text: '找不到有效的日期與價格數據，請確定下載的檔案是否包含日期與收盤價欄位。', confirmButtonColor: '#dcb38b'});
        }

        newHistory.sort((a,b) => new Date(a.date) - new Date(b.date));

        if (!marketPrices[ticker]) {
            marketPrices[ticker] = { price: newHistory[newHistory.length-1].price, history: newHistory };
        } else {
            marketPrices[ticker].history = newHistory;
            marketPrices[ticker].price = newHistory[newHistory.length-1].price;
        }

        if (isFirebaseConnected) {
            const latestPrice = newHistory[newHistory.length-1].price;
            priceRef.child(ticker).set(latestPrice);
        }

        calculatePortfolio(); 
        if (currentChartTicker === ticker && document.getElementById('detailModal').style.display === 'flex') {
            updateChart('year'); 
        }

        Swal.fire({icon: 'success', title: '匯入成功！', text: `代號 ${ticker} 已載入 ${newHistory.length} 筆報價，且已同步至雲端`, confirmButtonColor: '#b496c6'});
    }

    // ==========================================
    // Firebase 連線
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyBQZ6pPmXqgGVj3rtNKTx41gogyQUmD41E",
        authDomain: "stock-f6872.firebaseapp.com",
        databaseURL: "https://stock-f6872-default-rtdb.firebaseio.com", 
        projectId: "stock-f6872",
        storageBucket: "stock-f6872.firebasestorage.app",
        messagingSenderId: "211983551952",
        appId: "1:211983551952:web:d69f688d5d17ef2eaa3dd5",
        measurementId: "G-7D0Y468ZFB"
    };

    let db, txRef, priceRef, settingsRef;
    let allTransactions = []; 
    let customPrices = {}; 
    let portfolio = {}; 
    let currentFilter = 'all'; 
    let formTxType = 'buy';
    let currentChartTicker = '';
    let currentChartObj = null;
    let pieChartObj = null;
    let editingTxId = null;

    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        txRef = db.ref('stockpro/transactions');
        priceRef = db.ref('stockpro/customPrices');
        settingsRef = db.ref('stockpro/settings');
        isFirebaseConnected = true;

        txRef.on('value', (snapshot) => {
            allTransactions = [];
            if (snapshot.exists()) {
                snapshot.forEach(child => { allTransactions.push(child.val()); });
            }
            calculatePortfolio();
        });

        priceRef.on('value', (snapshot) => {
            if (snapshot.exists()) {
                customPrices = snapshot.val();
                Object.keys(customPrices).forEach(ticker => {
                    if (!marketPrices[ticker]) {
                        marketPrices[ticker] = { price: customPrices[ticker], history: [{date: todayStr, price: customPrices[ticker]}] };
                    } else {
                        marketPrices[ticker].price = customPrices[ticker];
                        let h = marketPrices[ticker].history;
                        let last = h.length > 0 ? h[h.length - 1] : null;
                        if (last && last.date === todayStr) last.price = customPrices[ticker]; 
                        else h.push({ date: todayStr, price: customPrices[ticker] });
                    }
                });
            }
            calculatePortfolio();
        });

        settingsRef.on('value', (snapshot) => {
            if (snapshot.exists() && snapshot.val().initialCapital !== undefined) {
                initialCapital = snapshot.val().initialCapital;
                document.getElementById('dash-initial-capital').innerText = '$' + parseFloat(initialCapital).toLocaleString();
            }
        });

    } catch (e) {
        console.error("Firebase 連線發生異常:", e);
        calculatePortfolio();
    }


    let marketPrices = {};

    function exportCSV() {
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF系統ID,股票代號,股票名稱,交易類別,策略標籤,數量(股),單價/總額,交易成本(手續費/稅金),交易日期,自訂備註\r\n";
        let sortedTxs = [...allTransactions].sort((a,b) => new Date(b.date) - new Date(a.date));
        sortedTxs.forEach(t => {
            let typeLabel = t.type === 'buy' ? '買進' : (t.type === 'sell' ? '賣出' : (t.type === 'div' ? '領息' : '觀望'));
            let stratLabel = t.strategy === 'day_trade' ? '當沖' : (t.strategy === 'short_term' ? '短期' : (t.strategy === 'long_term' ? '長期' : ''));
            csvContent += `${t.id},${t.ticker},${t.name},${typeLabel},${stratLabel},${t.quantity},${t.price},${t.fee||0},${t.date},${t.memo||''}\r\n`;
        });
        var link = document.createElement("a"); link.setAttribute("href", encodeURI(csvContent)); link.setAttribute("download", `StockPro_報表_${todayStr}.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }

    function setFilter(type) {
        currentFilter = type; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); document.getElementById(`filter-${type}`).classList.add('active');
        const titles = { 'all': '全部', 'day_trade': '當沖(持倉)', 'short_term': '短期持有', 'long_term': '長期持有', 'watch': '觀望中', 'sold_std': '一般結清', 'sold_day': '當沖結清' };
        document.getElementById('dash-title').innerText = `☕ 總覽 (${titles[type]})`; renderGrid();
    }

    function setTxType(type) {
        formTxType = type;
        document.getElementById('typeBuy').className = `type-btn buy ${type==='buy'?'active':''}`; document.getElementById('typeSell').className = `type-btn sell ${type==='sell'?'active':''}`;
        document.getElementById('typeWatch').className = `type-btn watch ${type==='watch'?'active':''}`; document.getElementById('typeDiv').className = `type-btn div ${type==='div'?'active':''}`;
        document.getElementById('qtyGroup').style.display = (type === 'watch' || type === 'div') ? 'none' : 'grid';
        document.getElementById('strategyGroup').style.display = type === 'buy' ? 'block' : 'none'; 
        
        document.getElementById('feeGroup').style.display = (type === 'buy' || type === 'sell') ? 'block' : 'none';
        document.getElementById('watchCurrentPriceGroup').style.display = type === 'watch' ? 'block' : 'none';
        
        if(type === 'watch') document.getElementById('priceLabel').innerText = '設定目標價'; 
        else if(type === 'div') document.getElementById('priceLabel').innerText = '領取總金額'; 
        else document.getElementById('priceLabel').innerText = '成交單價';
    }

    function clearFormFields() {
        document.getElementById('formTicker').value = ''; 
        document.getElementById('formName').value = '';
        document.getElementById('formQty').value = '';
        document.getElementById('formPrice').value = ''; 
        document.getElementById('formFee').value = '';
        document.getElementById('formMemo').value = ''; 
        document.getElementById('formCurrentPrice').value = '';
        document.getElementById('formDate').value = todayStr;
        document.getElementById('formUnit').value = 'share';
    }

    function openForm(prefill = null) {
        editingTxId = prefill && prefill.id ? prefill.id : null;
        document.getElementById('formTitle').innerText = editingTxId ? "✏️ 修改紀錄" : "➕ 新增紀錄"; 
        document.getElementById('formModal').style.display = 'flex';
        
        if (editingTxId) {
            document.getElementById('formTicker').value = prefill.ticker; document.getElementById('formName').value = prefill.name;
            document.getElementById('formQty').value = prefill.quantity; document.getElementById('formPrice').value = prefill.price;
            document.getElementById('formDate').value = prefill.date; document.getElementById('formMemo').value = prefill.memo || "";
            document.getElementById('formFee').value = prefill.fee || ""; document.getElementById('formUnit').value = 'share'; 
            document.getElementById('formCurrentPrice').value = marketPrices[prefill.ticker] ? marketPrices[prefill.ticker].price : '';
            if(prefill.strategy) document.getElementById('formStrategy').value = prefill.strategy; setTxType(prefill.type);
        } else {
            clearFormFields();
            if (prefill) {
                document.getElementById('formTicker').value = prefill.ticker || '';
                document.getElementById('formName').value = prefill.name || '';
            }
            setTxType('buy'); 
        }
    }

    function closeForm() { document.getElementById('formModal').style.display = 'none'; editingTxId = null; }
    function closeDetail() { document.getElementById('detailModal').style.display = 'none'; }
    function closeAnalysis() { document.getElementById('analysisModal').style.display = 'none'; }
    function closeProfitModal() { document.getElementById('profitModal').style.display = 'none'; }

    function saveTransaction() {
        let ticker = document.getElementById('formTicker').value.trim(); 
        const name = document.getElementById('formName').value.trim();
        let qty = (formTxType === 'watch' || formTxType === 'div') ? 0 : (parseInt(document.getElementById('formQty').value) || 0);
        const price = parseFloat(document.getElementById('formPrice').value) || 0; 
        const fee = parseFloat(document.getElementById('formFee').value) || 0;
        
        if (!ticker || !name || price <= 0 || ((formTxType !== 'watch' && formTxType !== 'div') && qty <= 0)) return Swal.fire("錯誤", "資料填寫不完整", "error");
        if ((formTxType !== 'watch' && formTxType !== 'div') && document.getElementById('formUnit').value === 'lot') qty = qty * 1000;

        let isClearing = false;
        let finalTicker = ticker;
        let finalName = name;
        let updates = {}; 

        if (!editingTxId && formTxType === 'sell') {
            let currentShares = 0;
            allTransactions.forEach(t => {
                if (t.ticker === ticker) {
                    if (t.type === 'buy') currentShares += t.quantity;
                    else if (t.type === 'sell') currentShares -= t.quantity;
                }
            });

            if (currentShares > 0 && (currentShares - qty) === 0) {
                isClearing = true;
                finalTicker = ticker + "(清)";
                let counter = 1;
                while (allTransactions.some(t => t.ticker === finalTicker)) {
                    counter++;
                    finalTicker = ticker + `(清${counter})`;
                }
                
                finalName = name + " (結案)";

                allTransactions.forEach(t => {
                    if (t.ticker === ticker) {
                        t.ticker = finalTicker; 
                        t.name = finalName;
                        if (isFirebaseConnected) {
                            updates[`${t.id}/ticker`] = finalTicker;
                            updates[`${t.id}/name`] = finalName;
                        }
                    }
                });

                if (marketPrices[ticker]) {
                    marketPrices[finalTicker] = JSON.parse(JSON.stringify(marketPrices[ticker]));
                    if (isFirebaseConnected) {
                        priceRef.child(finalTicker).set(marketPrices[ticker].price);
                    }
                }
            }
        }

        const txData = { id: editingTxId || ('tx_' + Date.now()), ticker: finalTicker, name: finalName, price, quantity: qty, type: formTxType, date: document.getElementById('formDate').value, memo: document.getElementById('formMemo').value };
        if(formTxType === 'buy') txData.strategy = document.getElementById('formStrategy').value; 
        if(formTxType === 'buy' || formTxType === 'sell') txData.fee = fee;

        if (isFirebaseConnected) {
            if (isClearing && Object.keys(updates).length > 0) txRef.update(updates);
            
            txRef.child(txData.id).set(txData).then(() => {
                Swal.fire({icon: "success", title: isClearing ? "已結清並獨立歸檔！" : "儲存成功", timer: 1500, showConfirmButton: false});
                closeForm(); clearFormFields();
                if (document.getElementById('detailModal').style.display === 'flex') {
                    if(isClearing) closeDetail(); 
                    else setTimeout(() => showDetail(finalTicker), 300);
                }
            });
            if (formTxType === 'watch') {
                const currentP = parseFloat(document.getElementById('formCurrentPrice').value);
                if (currentP > 0) priceRef.child(finalTicker).set(currentP);
            }
        } else {
            if (editingTxId) { const index = allTransactions.findIndex(t => t.id === editingTxId); if(index !== -1) allTransactions[index] = txData; } 
            else { allTransactions.push(txData); if (!marketPrices[finalTicker]) marketPrices[finalTicker] = { price: price, history: [{ date: txData.date, price: price }] }; }
            
            if (formTxType === 'watch') {
                const currentP = parseFloat(document.getElementById('formCurrentPrice').value);
                if (currentP > 0) {
                    if (!marketPrices[finalTicker]) marketPrices[finalTicker] = { price: currentP, history: [] };
                    marketPrices[finalTicker].price = currentP;
                    marketPrices[finalTicker].history.push({ date: txData.date, price: currentP });
                }
            }
            Swal.fire({icon: "success", title: isClearing ? "已結清並獨立歸檔！" : "儲存成功", timer: 1500, showConfirmButton: false});
            closeForm(); clearFormFields(); calculatePortfolio(); 
            if (document.getElementById('detailModal').style.display === 'flex') {
                if(isClearing) closeDetail(); else showDetail(finalTicker);
            }
        }
    }

    function calculatePortfolio() {
        portfolio = {};
        let sortedAll = [...allTransactions].sort((a,b) => new Date(a.date) - new Date(b.date));

        sortedAll.forEach(tx => {
            if (!portfolio[tx.ticker]) portfolio[tx.ticker] = { ticker: tx.ticker, name: tx.name, shares: 0, totalCost: 0, realizedGain: 0, realizedCostBasis: 0, history: [], hasTrade: false, watchPrice: 0, strategy: 'long_term' };
            let p = portfolio[tx.ticker]; p.history.push(tx);

            if (tx.type === 'buy') {
                p.shares += tx.quantity; p.totalCost += (tx.price * tx.quantity) + (tx.fee || 0); p.hasTrade = true; if(tx.strategy) p.strategy = tx.strategy; 
            } else if (tx.type === 'sell') {
                let avgCost = p.shares > 0 ? (p.totalCost / p.shares) : 0;
                let sellValue = tx.price * tx.quantity; let costBasis = avgCost * tx.quantity;
                let netGain = sellValue - costBasis - (tx.fee || 0);
                
                tx.costBasis = costBasis; tx.calculatedGain = netGain; p.realizedGain += netGain; p.realizedCostBasis += costBasis; 
                p.shares -= tx.quantity; p.totalCost -= costBasis; p.hasTrade = true;
                
                if (p.shares <= 0) p.totalCost = 0;
            } else if (tx.type === 'watch') { p.watchPrice = tx.price; 
            } else if (tx.type === 'div') { p.realizedGain += tx.price; tx.calculatedGain = tx.price; p.hasTrade = true; }
        });

        Object.values(portfolio).forEach(p => p.history.sort((a,b) => new Date(b.date) - new Date(a.date)));

        Object.values(portfolio).forEach(p => {
            if (p.shares > 0) p.status = p.strategy; else if (p.hasTrade) p.status = (p.strategy === 'day_trade' ? 'sold_day' : 'sold_std'); else p.status = 'watch';
            let mData = marketPrices[p.ticker] || {};
            p.currentPrice = mData.price || (p.status === 'watch' ? p.watchPrice : (p.shares>0 ? (p.totalCost/p.shares) : 0));
            p.avgPrice = p.shares > 0 ? (p.totalCost / p.shares) : 0; p.marketValue = p.shares * p.currentPrice; p.unrealizedGain = p.marketValue - p.totalCost;
            p.roiPercent = (p.shares > 0 && p.totalCost > 0) ? (p.unrealizedGain / p.totalCost) * 100 : 0;
            p.realizedRoiPercent = (p.realizedCostBasis > 0) ? (p.realizedGain / p.realizedCostBasis) * 100 : 0;
        });
        renderGrid(); 
    }

    function updateChart(timeframe) {
        document.querySelectorAll('.chart-tab').forEach(b => b.classList.remove('active'));
        document.getElementById(`tab-${timeframe}`).classList.add('active');
        let mData = marketPrices[currentChartTicker] || {}; let history = mData.history || [];
        const now = new Date(); let cutoff = new Date();
        
        if (timeframe === 'day') cutoff.setDate(now.getDate() - 1);
        else if (timeframe === 'week') cutoff.setDate(now.getDate() - 7);
        else if (timeframe === 'month') cutoff.setMonth(now.getMonth() - 1);
        else if (timeframe === 'quarter') cutoff.setMonth(now.getMonth() - 3);
        else if (timeframe === 'year') cutoff.setFullYear(now.getFullYear() - 1);

        let filtered = history.filter(h => new Date(h.date) >= cutoff);
        if (filtered.length === 0 && history.length > 0) filtered = [history[history.length-1]];

        const ctx = document.getElementById('priceChart').getContext('2d');
        if (currentChartObj) currentChartObj.destroy();
        Chart.defaults.font.family = "'Inter', sans-serif";
        Chart.defaults.color = '#9e8e82';
        
        const dataLength = filtered.length;
        const pointColors = filtered.map((_, i) => i === dataLength - 1 ? '#e26b6b' : '#dcb38b');
        const pointRadii = filtered.map((_, i) => i === dataLength - 1 ? 5 : (timeframe==='year' ? 0 : 3));

        currentChartObj = new Chart(ctx, {
            type: 'line',
            data: { 
                labels: filtered.map(h => h.date), 
                datasets: [{ 
                    data: filtered.map(h => h.price), 
                    borderColor: '#dcb38b', 
                    backgroundColor: 'rgba(220,179,139, 0.15)', 
                    fill: true, 
                    tension: 0,
                    pointRadius: pointRadii,
                    pointBackgroundColor: pointColors,
                    pointBorderColor: pointColors
                }] 
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { maxTicksLimit: 5, font: {size: 10} } }, y: { ticks: { font: {size: 10} } } } }
        });
    }

                res.forEach(item => { updates[item.ticker] = item.price; });
                priceRef.update(updates).then(() => {
                    Swal.fire({icon: "success", title: "完成", text:"價格已為您同步至雲端", timer: 1500, showConfirmButton: false});
                });
            } else {
                res.forEach(item => {
                    if(marketPrices[item.ticker]) {
                        marketPrices[item.ticker].price = item.price;
                        let h = marketPrices[item.ticker].history;
                        let last = h.length > 0 ? h[h.length - 1] : null;
                        if (last && last.date === todayStr) last.price = item.price; else h.push({ date: todayStr, price: item.price });
                    }
                });
                calculatePortfolio();
                Swal.fire({icon: "success", title: "完成", text:"價格已於本機更新", timer: 1500, showConfirmButton: false});
            }
        }
    }
</script>
